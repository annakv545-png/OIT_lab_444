<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration — WebStudio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/2.0.0/modern-normalize.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/main.css">
  
</head>
<body>
<main class="form-page">
  <div class="container">
    <a href="./index.html" class="logo"><span class="logo-light">Web</span>Studio</a>
    <h1 class="form-title">Registration</h1>
    <form action="#" method="post" class="auth-form" id="regForm">
      <div class="form-field">
        <label for="reg-name" class="field-label">Full Name</label>
        <div class="input-wrapper" data-error="Letters only, at least 2 characters">
          <input type="text" id="reg-name" name="name" class="form-input" placeholder="John Doe" minlength="2" pattern="[A-Za-zА-Яа-яІіЇїЄєҐґ' \-]{2,}" autocomplete="name" required>
        </div>
      </div>
      <div class="form-field">
        <label for="user-phone" class="field-label">Phone</label>
        <div class="input-wrapper" data-error="Format: +380 XX XXX XX XX">
          <input type="tel" id="user-phone" name="phone" class="form-input" placeholder="+380XXXXXXXXX" pattern="\+380[0-9]{9}" autocomplete="tel" required>
        </div>
      </div>
      <div class="form-field">
        <label for="reg-email" class="field-label">Email Address</label>
        <div class="input-wrapper" data-error="Enter a valid email">
          <input type="email" id="reg-email" name="email" class="form-input" placeholder="client@email.com" autocomplete="email" required>
        </div>
      </div>
      <div class="form-field">
        <label for="reg-pass" class="field-label">Password</label>
        <div class="input-wrapper" data-error="8+ characters, letters and digits">
          <input type="password" id="reg-pass" name="password" class="form-input" minlength="8" pattern="(?=.*\d)(?=.*[A-Za-z]).{8,}" placeholder="At least 8 characters" autocomplete="new-password" required>
        </div>
      </div>
      <div class="form-field">
        <label for="reg-pass-confirm" class="field-label">Confirm Password</label>
        <div class="input-wrapper" data-error="At least 8 characters">
          <input type="password" id="reg-pass-confirm" name="password_confirm" class="form-input" minlength="8" placeholder="Repeat password" autocomplete="new-password" required>
        </div>
      </div>
      <div class="form-field">
        <label for="user-comment" class="field-label">Comment</label>
        <textarea id="user-comment" name="comment" class="form-textarea" placeholder="Write your comment"></textarea>
      </div>
      <div class="checkbox-wrapper">
        <input type="checkbox" id="privacy-checkbox" class="visually-hidden" required>
        <label for="privacy-checkbox" class="checkbox-label">
          <span class="custom-checkbox">
            <svg class="checkbox-icon" width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M1 5L4.5 8.5L11 1.5" stroke="white" stroke-width="2" fill="none"/></svg>
          </span>
          I accept the <a href="#" class="privacy-link">Privacy Policy</a>
        </label>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-submit">Register</button>
        <button type="reset" class="btn-reset">Reset</button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
