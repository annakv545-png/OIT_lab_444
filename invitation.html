<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation — WebStudio</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --accent:#4d5ae5; --dark:#2e2f42; --light:#f4f4fd; }
    * { box-sizing: border-box; }
    body { margin:0; padding:40px 16px; font-family:"Roboto",sans-serif; color:var(--dark); background:var(--light); text-align:center; }
    .actions { margin-bottom:32px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
    button, .back { height:48px; padding:0 32px; font:500 16px "Roboto",sans-serif; border:0; border-radius:4px; cursor:pointer; color:#fff; background:var(--accent); text-decoration:none; display:inline-flex; align-items:center; transition:background-color .25s; }
    button:hover, .back:hover { background:#404bbf; }
    .sheet { display:flex; flex-wrap:wrap; gap:48px; justify-content:center; align-items:flex-start; }

    /* Конверт */
    .envelope { position:relative; width:360px; height:240px; background:#dfe2fb; border-radius:4px; box-shadow:0 4px 16px rgba(46,47,66,.2); }
    .envelope::before { content:""; position:absolute; inset:0; background:linear-gradient(135deg,transparent 50%,#c9cdf5 50%) left/50% 100% no-repeat, linear-gradient(225deg,transparent 50%,#c9cdf5 50%) right/50% 100% no-repeat; border-radius:4px; }
    .flap { position:absolute; top:0; left:0; width:100%; height:130px; background:var(--accent); clip-path:polygon(0 0,100% 0,50% 100%); }
    .seal { position:absolute; top:100px; left:50%; width:44px; height:44px; margin-left:-22px; border-radius:50%; background:#31d0aa; color:#fff; font:700 18px "Raleway",sans-serif; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.25); }
    .address { position:absolute; bottom:24px; left:0; right:0; font-size:14px; line-height:1.5; }

    /* Запрошення */
    .card { width:360px; padding:40px 24px; background:#fff; border:2px solid var(--accent); border-radius:4px; box-shadow:0 4px 16px rgba(46,47,66,.15); }
    .card h1 { margin:0 0 8px; font:700 32px/1.2 "Raleway",sans-serif; letter-spacing:.03em; }
    .card .lead { margin:0 0 24px; color:var(--accent); font-weight:500; }
    .card dl { margin:0 0 24px; line-height:1.8; }
    .card dt { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8e8f99; }
    .card dd { margin:0 0 12px; font-weight:500; }

    @page { size:A4; margin:12mm; }
    @media print {
      body { padding:0; background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .actions { display:none; }
      .sheet { flex-direction:column; align-items:center; gap:24mm; }
      .envelope, .card { box-shadow:none; }
      .card { break-before:page; }
    }
  </style>
</head>
<body>
  <div class="actions">
    <button type="button" onclick="window.print()">🖨 Print</button>
    <a class="back" href="./index.html">Back to site</a>
  </div>
  <div class="sheet">
    <div class="envelope" aria-label="Envelope">
      <div class="flap"></div><div class="seal">W</div>
      <p class="address">To: our dear partner<br>Chernivtsi, Ukraine</p>
    </div>
    <article class="card">
      <h1>You are invited!</h1>
      <p class="lead">WebStudio Anniversary Party</p>
      <dl>
        <dt>Date</dt><dd>December 20, 2026</dd>
        <dt>Time</dt><dd>18:00</dd>
        <dt>Place</dt><dd>WebStudio Office, Chernivtsi</dd>
      </dl>
      <p>We would be happy to celebrate this day together with you.</p>
    </article>
  </div>
</body>
</html>
